apply plugin: 'com.android.application'

android {
    namespace 'org.appcrasher.crasher'
    compileSdk 33

    defaultConfig {
        applicationId "org.appcrasher.crasher"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
