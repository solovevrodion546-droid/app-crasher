name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Android SDK and accept licenses
      run: |
        ANDROID_HOME="$HOME/android-sdk"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        
        # Download and extract
        cd "$ANDROID_HOME/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O ct.zip
        if [ ! -f ct.zip ] || [ ! -s ct.zip ]; then
          echo "ERROR: Download failed"
          exit 1
        fi
        unzip -qo ct.zip
        mv cmdline-tools latest
        rm ct.zip
        
        # Accept licenses using sdkmanager from cmdline-tools
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        sdkmanager --version || { echo "sdkmanager broken, trying alternatives..."; exit 1; }
        yes | sdkmanager --licenses
        
        echo "SDK setup complete"
        sdkmanager --list_installed

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Build APK
      run: |
        ANDROID_HOME="$HOME/android-sdk"
        export ANDROID_HOME
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        
        # Verify tools exist
        echo "=== Tools ==="
        ls "$ANDROID_HOME/cmdline-tools/latest/bin/"
        echo "=== Starting buildozer ==="
        
        buildozer android debug 2>&1 | tee /tmp/build.log
        
        echo "=== BUILD DONE ==="
        tail -5 /tmp/build.log

    - name: Debug APK search
      if: always()
      run: |
        echo "=== Searching APK ==="
        find "$HOME" -name "*.apk" 2>/dev/null | head -5
        ls -la dist/ 2>/dev/null

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
