name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        curl -sLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q cmdline.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
        export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        buildozer android debug 2>&1 | tail -50

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
