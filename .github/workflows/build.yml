name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Android SDK (install to buildozer location)
      run: |
        # Create buildozer's expected Android SDK path
        BUILD_DIR="$HOME/.buildozer/android/platform"
        mkdir -p "$BUILD_DIR/android-sdk"
        mkdir -p "$BUILD_DIR/android-sdk/cmdline-tools"
        
        cd "$BUILD_DIR/android-sdk/cmdline-tools"
        curl -sLO https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-10406996_latest.zip
        
        # Accept licenses
        export PATH="$BUILD_DIR/android-sdk/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses
        
        # Install required packages
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
        
        # Verify installation
        ls -la "$BUILD_DIR/android-sdk/build-tools/"
        ls -la "$BUILD_DIR/android-sdk/platforms/"

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Build APK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        buildozer android debug 2>&1 | tee /tmp/build.log
        echo "---LAST 10 LINES---"
        tail -10 /tmp/build.log

    - name: Check APK
      if: always()
      run: |
        echo "=== Checking for APK ==="
        find "$HOME" -name "*.apk" -type f 2>/dev/null
        ls -la dist/*.apk 2>/dev/null || echo "No APK in dist/"
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
