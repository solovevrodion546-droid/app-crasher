name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Android SDK for buildozer
      run: |
        # Create buildozer's expected directory structure
        BUILD_DIR="$HOME/.buildozer/android/platform"
        mkdir -p "$BUILD_DIR/android-sdk/tools/bin"
        mkdir -p "$BUILD_DIR/android-sdk/cmdline-tools"
        
        cd "$BUILD_DIR/android-sdk/cmdline-tools"
        curl -sLO https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip
        
        # Copy sdkmanager to tools/bin (buildozer expects it here)
        mkdir -p latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties latest/ 2>/dev/null || true
        
        # Also copy to tools/bin
        cp -r latest/bin/* "$BUILD_DIR/android-sdk/tools/bin/" 2>/dev/null || true
        
        rm commandlinetools-linux-10406996_latest.zip
        
        export PATH="$BUILD_DIR/android-sdk/tools/bin:$BUILD_DIR/android-sdk/cmdline-tools/latest/bin:$PATH"
        
        # Accept ALL licenses
        yes | sdkmanager --licenses
        
        # Install critical packages  
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools" "ndk;25b"
        
        # Verify
        echo "=== SDK tools ==="
        ls "$BUILD_DIR/android-sdk/tools/bin/"
        echo "=== build-tools ==="
        ls "$BUILD_DIR/android-sdk/build-tools/" 2>/dev/null
        echo "=== platforms ==="
        ls "$BUILD_DIR/android-sdk/platforms/" 2>/dev/null

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Build APK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export PATH="$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        buildozer android debug

    - name: Check for APK
      if: always()
      run: |
        echo "=== Looking for APK ==="
        find "$HOME/.buildozer" -name "*.apk" -type f 2>/dev/null
        find "$HOME" -maxdepth 4 -name "app-crasher*.apk" -type f 2>/dev/null
        ls -la dist/*.apk 2>/dev/null || echo "No APK in dist/"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
