name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Accept SDK licenses early
      run: |
        mkdir -p /tmp/android-sdk/cmdline-tools
        cd /tmp/android-sdk/cmdline-tools
        curl -sLO https://dl.google.com/android/repository/commandlinetools-linux-11262923_latest.zip
        unzip -qo commandlinetools-linux-11262923_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11262923_latest.zip
        export PATH="/tmp/android-sdk/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses
        echo "Licenses accepted."

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Build APK (let buildozer handle SDK/NDK)
      run: |
        export PATH="/tmp/android-sdk/cmdline-tools/latest/bin:$PATH"
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        buildozer android debug 2>&1 | tee /tmp/build.log
        echo "=== BUILD EXIT CODE: $? ==="
        echo "=== Last 30 lines ==="
        tail -30 /tmp/build.log

    - name: Debug APK search
      if: always()
      run: |
        echo "=== Searching for APK ==="
        find "$HOME" -name "*.apk" 2>/dev/null | head -5
        ls -laR dist/ 2>/dev/null || echo "No dist/"
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
