name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download and setup Android SDK
      run: |
        # This is where buildozer will place its SDK
        BUILD_DIR="$HOME/.buildozer/android/platform"
        SDK_DIR="$BUILD_DIR/android-sdk"
        
        mkdir -p "$SDK_DIR/cmdline-tools"
        mkdir -p "$SDK_DIR/build-tools"
        mkdir -p "$SDK_DIR/tools/bin"
        mkdir -p "$SDK_DIR/tools"
        
        # Download SDK command line tools
        cd "$SDK_DIR/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O ct.zip
        unzip -qo ct.zip
        mv cmdline-tools latest
        rm ct.zip
        
        # Create tools/bin/sdkmanager symlink (buildozer looks here)
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager.bat" 2>/dev/null || true
        
        # Accept licenses
        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/tools/bin:$PATH"
        yes | sdkmanager --licenses
        
        # Install build-tools and platform into buildozer's SDK
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
        
        # Verify
        echo "=== SDK tools/bin ==="
        ls "$SDK_DIR/tools/bin/"
        echo "=== build-tools ==="
        ls "$SDK_DIR/build-tools/"
        echo "=== platforms ==="
        ls "$SDK_DIR/platforms/"

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Patch buildozer to use correct sdkmanager
      run: |
        # buildozer uses tools/bin/sdkmanager - verify the link works
        echo "Testing sdkmanager link..."
        "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version
        echo "sdkmanager works!"

    - name: Build APK
      run: |
        export PATH="$HOME/.buildozer/android/platform/android-sdk/tools/bin:$PATH"
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        
        buildozer android debug 2>&1 | tee /tmp/build.log
        EXIT_CODE=${PIPESTATUS[0]}
        echo "=== EXIT CODE: $EXIT_CODE ==="
        echo "=== Last 20 lines ==="
        tail -20 /tmp/build.log

    - name: Search for APK
      if: always()
      run: |
        echo "=== Searching for APK ==="
        find "$HOME" -name "*.apk" -type f 2>/dev/null | head -5
        ls -la dist/ 2>/dev/null || echo "No dist/"
        cat /tmp/build.log 2>/dev/null | grep -i "apk\|error\|fail\|success" | tail -10

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
