name: Build AppCrasher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git ffmpeg pkg-config curl unzip \
          libsqlite3-dev libffi-dev libssl-dev zlib1g-dev \
          libxml2-dev libxslt1-dev libjpeg-dev libwebp-dev \
          libopenjp2-7-dev libharfbuzz-dev libfribidi-dev \
          libfreetype6-dev libpng-dev libmpv-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libgstreamer1.0-dev gst-plugins-base gst-plugins-good \
          gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
          libyaml-dev liblzma-dev libbz2-dev \
          autoconf automake libtool

    - name: Download Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
        unzip -q cmdline.zip
        export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "platforms;android-33" "build-tools;33.0.0" "platform-tools"
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
        echo "$HOME/android-sdk/build-tools;33.0.0" >> $GITHUB_PATH

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        buildozer android debug 2>&1 | tail -100

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: dist/*.apk
        retention-days: 7
