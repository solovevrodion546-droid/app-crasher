name: Build AppCrasher APK (Pure Java)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        
        # Try direct download (proxies unreliable)
        curl -sL --connect-timeout 30 --max-time 300 \
          "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" \
          -o ct.zip
        
        # Verify download
        FILESIZE=$(stat -c%s ct.zip 2>/dev/null || echo 0)
        if [ "$FILESIZE" -lt 1000 ]; then
          echo "ERROR: Download failed or too small ($FILESIZE bytes)"
          cat ct.zip | head -c 200
          exit 1
        fi
        echo "Downloaded $FILESIZE bytes"
        
        unzip -qo ct.zip
        mv cmdline-tools latest
        rm ct.zip
        
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
        sdkmanager --list_installed | head -5

    - name: Build APK with Gradle
      run: |
        cd java_project
        chmod +x gradlew.bat 2>/dev/null || true
        
        # Use gradle wrapper or download gradle
        mkdir -p gradle/wrapper
        cat > gradlew << 'EOFGRADLE'
        #!/bin/bash
        GRADLE_HOME="$HOME/.gradle/wrapper/dists/gradle-8.2-bin"
        if [ ! -d "$GRADLE_HOME" ]; then
          curl -sL "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o gradle.zip
          unzip -qo gradle.zip -d "$HOME/.gradle/wrapper/dists/"
        fi
        "$HOME/.gradle/wrapper/dists/gradle-8.2-bin/gradle-8.2/bin/gradle" "$@"
        EOFGRADLE
        chmod +x gradlew
        
        ./gradlew assembleDebug --info 2>&1 | tee /tmp/gradle.log
        
        echo "=== Build output ==="
        find . -name "*.apk" -type f

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: java_project/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
