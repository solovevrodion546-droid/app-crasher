name: Build AppCrasher APK (Pure Java)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        
        # Try direct download (proxies unreliable)
        curl -sL --connect-timeout 30 --max-time 300 \
          "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" \
          -o ct.zip
        
        # Verify download
        FILESIZE=$(stat -c%s ct.zip 2>/dev/null || echo 0)
        if [ "$FILESIZE" -lt 1000 ]; then
          echo "ERROR: Download failed or too small ($FILESIZE bytes)"
          cat ct.zip | head -c 200
          exit 1
        fi
        echo "Downloaded $FILESIZE bytes"
        
        unzip -qo ct.zip
        mv cmdline-tools latest
        rm ct.zip
        
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
        sdkmanager --list_installed | head -5

    - name: Download Gradle
      run: |
        mkdir -p $HOME/.gradle/wrapper/dists/gradle-8.2-bin
        curl -sL --connect-timeout 30 --max-time 300 \
          "https://services.gradle.org/distributions/gradle-8.2-bin.zip" \
          -o /tmp/gradle-8.2-bin.zip
        unzip -qo /tmp/gradle-8.2-bin.zip -d $HOME/.gradle/wrapper/dists/gradle-8.2-bin/
        export PATH="$HOME/.gradle/wrapper/dists/gradle-8.2-bin/gradle-8.2/bin:$PATH"
        gradle --version

    - name: Build APK with Gradle
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        cd java_project
        gradle assembleDebug 2>&1 | tee /tmp/gradle.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-crasher-apk
        path: java_project/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
